name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Production build and real Worker verification
        run: |
          npm run build
          npm run test:production
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/sonwork-dry-run"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
