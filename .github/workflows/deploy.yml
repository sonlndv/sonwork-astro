name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Rebuild production and verify the actual Worker runtime
        run: |
          npm run build
          npm run test:production
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/sonwork-dry-run"
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify exact live release and approved content
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-release.mjs https://sonwork.org "$GITHUB_SHA" "$RUNNER_TEMP/live-release-inventory.json"; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::The exact approved production release did not pass live verification.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-verification
          path: |
            ${{ runner.temp }}/live-release-inventory.json
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
