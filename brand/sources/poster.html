<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@800&family=Saira+Condensed:wght@700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d13;--ink:#f4f6fc;--ink3:#8a93a8;--blue:#2f6bff;--blue-hi:#5b8bff;--line:rgba(140,160,210,.18)}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:var(--bg);color:var(--ink);font-family:'Saira Condensed',sans-serif;overflow:hidden;position:relative;padding:64px}
body::after{content:"";position:absolute;right:-18%;top:-10%;width:70%;height:70%;background:radial-gradient(circle at 60% 40%,rgba(47,107,255,.30),transparent 62%)}
body::before{content:"";position:absolute;inset:0;opacity:.45;background:repeating-linear-gradient(116deg,transparent 0 54px,rgba(140,160,210,.03) 54px 55px)}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.mk{font-family:'Saira Condensed';font-weight:900;font-size:40px;transform:skewX(-10deg);letter-spacing:-.03em}.mk .b{color:var(--blue)}
.mid{margin-top:auto;margin-bottom:auto}
.kick{font-family:'JetBrains Mono';font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue-hi);margin-bottom:24px}
.name{font-family:'Bodoni Moda';font-weight:800;font-size:440px;line-height:.78;letter-spacing:-.02em}
.rule{height:8px;width:300px;background:var(--blue);margin:30px 0;box-shadow:0 0 30px rgba(47,107,255,.6)}
.state{font-family:'Saira Condensed';font-weight:700;font-size:46px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;max-width:18ch}
.state b{color:var(--blue-hi)}
.foot{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line);padding-top:24px}
</style></head><body>
<div class="wrap">
<div class="top"><span>sonwork.org</span><span class="mk"><span>LS</span><span class="b">15</span></span></div>
<div class="mid">
<div class="kick">One-person holding company · Saigon · 2026</div>
<div class="name">Sơn</div>
<div class="rule"></div>
<div class="state">Builder of <b>companies</b>,<br>one person deep.</div>
</div>
<div class="foot"><span>Perfeat · Paddock · Company OS</span><span>Field log →</span></div>
</div>
</body></html>
