<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>opt3 dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e15;--panel:#12141d;--ink:#eef1f8;--ink2:#a7adbe;--ink3:#6c7283;--blue:#356bff;--blue-hi:#6f97ff;--line:rgba(130,150,200,.14)}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;height:100vh;overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:0 56px;height:100%;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{font-family:'Bricolage Grotesque';font-weight:800;font-size:21px;letter-spacing:-.01em}.brand .d{color:var(--blue)}
.nl{display:flex;gap:28px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.nl a{color:var(--ink3);text-decoration:none}.nl a.on{color:var(--blue)}
.hero{flex:1;display:grid;grid-template-columns:1.3fr .9fr;gap:60px;align-items:center}
.L .ey{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue-hi);margin-bottom:20px}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:128px;line-height:.92;letter-spacing:-.03em;margin-bottom:24px}
.lead{font-size:21px;line-height:1.5;color:var(--ink2);max-width:34ch}.lead b{color:var(--ink)}
/* right: a "currently" instrument panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.panel h2{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:18px;display:flex;justify-content:space-between}
.panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.row .n{font-family:'Bricolage Grotesque';font-weight:700;font-size:19px}
.row .s{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.row .s.b{color:var(--ink3)}
.tiny{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-top:16px;letter-spacing:.04em}
</style></head><body>
<div class="wrap">
<nav><div class="brand">sonwork<span class="d">.</span></div><div class="nl"><a class="on">Work</a><a>Writing</a><a>About</a></div></nav>
<div class="hero">
<div class="L">
<div class="ey">Builder · one-person holding co · Saigon</div>
<h1>Sơn</h1>
<p class="lead"><b>VC, then operator, now builder.</b> I run a one-person holding company — and write down how it's actually going.</p>
</div>
<div class="panel">
<h2><span>Currently building</span><span class="dot"></span></h2>
<div class="row"><span class="n">Perfeat</span><span class="s">Active</span></div>
<div class="row"><span class="n">Paddock</span><span class="s">Building</span></div>
<div class="row"><span class="n">Company OS</span><span class="s b">Infra</span></div>
<div class="tiny">SGN · 2026 SEASON · 02 LIVE</div>
</div>
</div></div></body></html>
