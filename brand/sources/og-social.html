<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700;800&family=Saira+Condensed:wght@700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d13;--ink:#f4f6fc;--ink3:#8a93a8;--blue:#2f6bff;--blue-hi:#5b8bff;--line:rgba(140,160,210,.16)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{background:var(--bg);color:var(--ink);font-family:'Saira Condensed',sans-serif;overflow:hidden;position:relative;
background-image:radial-gradient(700px 460px at 88% -12%,rgba(47,107,255,.26),transparent 60%);
display:flex;flex-direction:column;justify-content:center;padding:0 84px}
body::before{content:"";position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(116deg,transparent 0 46px,rgba(140,160,210,.03) 46px 47px)}
.top{position:absolute;top:48px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);z-index:2}
.mk{font-family:'Saira Condensed';font-weight:900;font-size:30px;transform:skewX(-10deg);letter-spacing:-.03em}.mk .b{color:var(--blue)}
.big{font-family:'Bodoni Moda';font-weight:800;font-size:230px;line-height:.82;letter-spacing:-.01em;position:relative;z-index:2}
.sub{font-family:'Saira Condensed';font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-top:6px;z-index:2}
.sub b{color:var(--blue-hi)}
.foot{position:absolute;bottom:48px;left:84px;right:84px;display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);z-index:2}
</style></head><body>
<div class="top"><span>sonwork.org</span><span class="mk"><span>LS</span><span class="b">15</span></span></div>
<div class="big">Sơn</div>
<div class="sub">Builder of <b>companies</b>, one person deep</div>
<div class="foot"><span>Solo founder · Saigon</span><span>Perfeat · Paddock · 2026</span></div>
</body></html>
