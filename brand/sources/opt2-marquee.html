<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>opt2 marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--ink:#f4f6fc;--ink2:#a9b0c2;--ink3:#6b7388;--blue:#2f6bff;--blue-hi:#5b8bff}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;height:100vh;overflow:hidden;position:relative}
/* big offset blue glow + a diagonal blue slash */
body::after{content:"";position:fixed;right:-12%;top:-20%;width:60%;height:80%;background:radial-gradient(circle at 60% 40%,rgba(47,107,255,.32),transparent 62%);filter:blur(8px)}
.wrap{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:0 56px;height:100%;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:30px 0}
.brand{font-family:'Anton';font-size:24px;letter-spacing:.04em}.brand .d{color:var(--blue)}
.nl{display:flex;gap:28px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.nl a{color:var(--ink3);text-decoration:none}.nl a.on{color:var(--ink);border-bottom:2px solid var(--blue);padding-bottom:3px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.kick{font-family:'JetBrains Mono';font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
h1{font-family:'Anton';font-size:clamp(120px,30vw,420px);line-height:.78;letter-spacing:.005em;text-transform:uppercase;margin:0 0 4px -.04em;position:relative}
h1 .u{color:var(--blue)}
.rule{height:6px;width:240px;background:var(--blue);margin:18px 0 30px;box-shadow:0 0 24px rgba(47,107,255,.6)}
.sub{font-family:'Archivo';font-weight:600;font-size:26px;max-width:30ch;line-height:1.15;color:var(--ink)}
.sub span{color:var(--ink3);font-weight:500;font-size:18px;display:block;margin-top:14px;line-height:1.5}
.foot{display:flex;gap:14px;margin-top:auto;margin-bottom:42px}
.pill{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:11px 20px;border-radius:999px}
.pill.f{background:var(--blue);color:#fff}.pill.g{border:1px solid rgba(130,150,200,.3);color:var(--ink2)}
</style></head><body>
<div class="wrap">
<nav><div class="brand">SONWORK<span class="d">.</span></div><div class="nl"><a class="on">Work</a><a>Writing</a><a>About</a></div></nav>
<div class="hero">
<div class="kick">Solo founder · Saigon · 2026</div>
<h1>Sơ<span class="u">n</span></h1>
<div class="rule"></div>
<p class="sub">I build companies, one person deep.<span>Perfeat, Paddock, and the systems that run them — shipped solo, in the open.</span></p>
<div class="foot"><span class="pill f">See the work →</span><span class="pill g">Field log</span></div>
</div></div></body></html>
