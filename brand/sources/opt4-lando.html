<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>opt4 lando-faithful</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500&family=Saira+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d13;--ink:#f2f4fb;--ink2:#aab2c6;--ink3:#697088;--blue:#2f6bff;--blue-hi:#5b8bff;--line:rgba(140,160,210,.16)}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Saira Condensed',sans-serif;height:100vh;overflow:hidden;position:relative}
/* top bar */
nav{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:30px 48px}
.logo{line-height:.82}
.logo .a{font-family:'Bodoni Moda';font-weight:700;font-size:30px;letter-spacing:.01em;display:block}
.logo .b{font-family:'Saira Condensed';font-weight:800;font-size:18px;letter-spacing:.32em;color:var(--ink2);text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:26px}
.tnav{display:flex;gap:24px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.tnav a{color:var(--ink3);text-decoration:none}.tnav a.on{color:var(--ink)}
.pill{font-family:'Saira Condensed';font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:#fff;padding:11px 20px;border-radius:8px;display:flex;gap:8px;align-items:center}
/* stage: left type, right portrait */
.stage{display:grid;grid-template-columns:1.05fr .95fr;height:100%}
.left{display:flex;flex-direction:column;justify-content:center;padding:0 0 0 48px;position:relative;z-index:3}
.kick{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue-hi);margin-bottom:18px}
.big{font-family:'Bodoni Moda';font-weight:800;font-size:clamp(120px,16vw,230px);line-height:.84;letter-spacing:-.01em;margin-bottom:4px}
.role{font-family:'Saira Condensed';font-weight:700;font-size:clamp(22px,3vw,34px);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-bottom:28px}
.role b{color:var(--blue-hi)}
.lead{font-family:'Saira Condensed';font-weight:600;font-size:19px;letter-spacing:.01em;color:var(--ink2);max-width:40ch;line-height:1.35;text-transform:none}
/* right portrait stage */
.right{position:relative;background:
  radial-gradient(120% 90% at 70% 20%,rgba(47,107,255,.30),transparent 60%),
  linear-gradient(180deg,#10131c,#0b0d13);}
.right::after{content:"PORTRAIT / VISUAL";position:absolute;inset:auto 0 50% 0;text-align:center;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.3em;color:var(--ink3);opacity:.6}
.right .figure{position:absolute;right:8%;bottom:0;width:62%;height:84%;background:linear-gradient(180deg,rgba(47,107,255,.10),rgba(47,107,255,.02));border-top-left-radius:200px;border-top-right-radius:200px;border:1px solid var(--line);border-bottom:0}
/* notched ticket */
.ticket{position:absolute;left:48px;bottom:38px;z-index:4;width:264px;background:#0f131d;border:1px solid var(--line);padding:16px 18px 18px;border-radius:12px;
  clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);}
.ticket .h{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;margin-bottom:12px}
.ticket .h .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.ticket .r{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.ticket .n{font-family:'Bodoni Moda';font-weight:700;font-size:17px}
.ticket .s{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-hi)}
</style></head><body>
<nav>
  <div class="logo"><span class="a">Sơn</span><span class="b">Sonwork</span></div>
  <div class="top-r"><div class="tnav"><a class="on">Work</a><a>Writing</a><a>About</a></div><span class="pill">Work ↗</span></div>
</nav>
<div class="stage">
  <div class="left">
    <div class="kick">Solo founder · Saigon · 2026</div>
    <div class="big">Sơn</div>
    <div class="role">Builder of <b>companies</b>, one&nbsp;person&nbsp;deep</div>
    <p class="lead">A one-person holding company — the projects, the systems, and the field notes, shipped in the open.</p>
  </div>
  <div class="right"><div class="figure"></div></div>
</div>
<div class="ticket">
  <div class="h"><span>Now building</span><span class="dot"></span></div>
  <div class="r"><span class="n">Perfeat</span><span class="s">Active</span></div>
  <div class="r"><span class="n">Paddock</span><span class="s">Building</span></div>
</div>
</body></html>
