<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>opt1 telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;800;900&family=Saira+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1018;--ink:#eef2fb;--ink2:#aeb6c9;--ink3:#6f7890;--blue:#2f6bff;--blue-hi:#5b8bff;--line:rgba(130,150,200,.16)}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Saira',sans-serif;height:100vh;overflow:hidden;
background-image:radial-gradient(800px 500px at 85% -10%,rgba(47,107,255,.20),transparent 60%);}
body::before{content:"";position:fixed;inset:0;opacity:.5;background:repeating-linear-gradient(116deg,transparent 0 40px,rgba(130,150,200,.035) 40px 41px)}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:0 56px;height:100%;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{font-family:'Saira Condensed';font-weight:900;font-size:22px;letter-spacing:.02em}.brand .d{color:var(--blue)}
.nl{display:flex;gap:30px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.nl a{color:var(--ink3);text-decoration:none}.nl a.on{color:var(--blue)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center}
.ey{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--blue-hi);margin-bottom:22px;display:flex;gap:14px;align-items:center}
.ey::before{content:"";width:44px;height:2px;background:var(--blue)}
h1{font-family:'Saira Condensed';font-weight:900;font-size:200px;line-height:.8;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:24px}
.hook{font-family:'Saira';font-weight:600;font-size:22px;color:var(--ink2);max-width:46ch;line-height:1.4}
.hook b{color:var(--ink)}
.strip{display:flex;gap:48px;margin-top:auto;margin-bottom:40px;padding-top:22px;border-top:1px solid var(--line);font-family:'JetBrains Mono'}
.t .v{font-family:'Saira Condensed';font-weight:800;font-size:32px;line-height:1}.t .v.b{color:var(--blue)}
.t .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:5px}
</style></head><body>
<div class="wrap">
<nav><div class="brand">SONWORK<span class="d">.</span></div><div class="nl"><a class="on">Work</a><a>Writing</a><a>About</a></div></nav>
<div class="hero">
<div class="ey">One-person holding company</div>
<h1>Sơn</h1>
<p class="hook"><b>Builder.</b> Shipping a one-person holding company from Saigon — the projects, the systems, the field notes.</p>
<div class="strip">
<div class="t"><div class="v b">02</div><div class="k">Ventures live</div></div>
<div class="t"><div class="v">2026</div><div class="k">Season</div></div>
<div class="t"><div class="v">SGN</div><div class="k">Base</div></div>
</div>
</div></div></body></html>
