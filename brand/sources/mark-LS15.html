<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LS15 marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Saira+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d13;--card:#10131c;--ink:#f2f4fb;--ink3:#697088;--blue:#2f6bff;--blue-hi:#5b8bff;--line:rgba(140,160,210,.16)}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;min-height:100vh;padding:44px 48px}
h0{display:block;font-family:'Saira Condensed';font-weight:800;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:1180px;margin:0 auto}
.cell{background:var(--card);border:1px solid var(--line);border-radius:16px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;overflow:hidden}
.cell .tag{position:absolute;top:16px;left:18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.cell .tag b{color:var(--blue-hi)}
.glow{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 45%,rgba(47,107,255,.16),transparent 60%)}

/* 01 SPEED — slanted angular, L7-style */
.m1{font-family:'Saira Condensed';font-weight:900;font-size:120px;line-height:.8;letter-spacing:-.02em;transform:skewX(-11deg);display:flex;align-items:flex-end;gap:2px}
.m1 .ls{color:var(--ink)} .m1 .n{color:var(--blue);font-size:120px} .m1 .sm{font-size:46px;color:var(--blue-hi);transform:translateY(-6px)}

/* 02 STACK — LS huge, 15 badge */
.m2{display:flex;align-items:center;gap:14px}
.m2 .ls{font-family:'Anton';font-size:130px;line-height:.8;letter-spacing:-.01em}
.m2 .b{display:flex;flex-direction:column;line-height:1}
.m2 .b .one{font-family:'Anton';font-size:62px;color:var(--blue)}
.m2 .b .lab{font-family:'JetBrains Mono';font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--ink3);writing-mode:vertical-rl;transform:rotate(180deg);position:absolute}

/* 03 PLATE — number-plate roundel */
.m3{display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:12px;overflow:hidden;font-family:'Saira Condensed';font-weight:800}
.m3 .l{padding:18px 22px;font-size:74px;line-height:.9}
.m3 .r{padding:18px 22px;font-size:74px;line-height:.9;background:var(--blue);color:#fff;display:flex;align-items:center}
.m3 .dot{align-self:center;width:8px;height:8px;border-radius:50%;background:var(--blue);margin:0 -4px}

/* 04 MONO — interlocked LS + 15 superscript */
.m4{position:relative;font-family:'Anton';line-height:.8}
.m4 .ls{font-size:150px;letter-spacing:-.08em}
.m4 .ls .s{color:var(--blue)}
.m4 .sup{position:absolute;top:6px;right:-26px;font-family:'JetBrains Mono';font-weight:700;font-size:24px;color:var(--blue-hi);letter-spacing:.02em}
</style></head><body>
<h0>SƠN — personal mark · "LS15" · 4 directions (Red Bull blue)</h0>
<div class="grid">
  <div class="cell"><div class="glow"></div><span class="tag"><b>01</b> · Speed</span>
    <div class="m1"><span class="ls">LS</span><span class="n">15</span></div></div>
  <div class="cell"><div class="glow"></div><span class="tag"><b>02</b> · Stack</span>
    <div class="m2"><span class="ls">LS</span><span class="b"><span class="one">15</span></span></div></div>
  <div class="cell"><div class="glow"></div><span class="tag"><b>03</b> · Plate</span>
    <div class="m3"><span class="l">LS</span><span class="r">15</span></div></div>
  <div class="cell"><div class="glow"></div><span class="tag"><b>04</b> · Mono</span>
    <div class="m4"><span class="ls">L<span class="s">S</span></span><span class="sup">15</span></div></div>
</div>
</body></html>
